<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
<title id="title">Eurydica / District relationships</title><desc id="desc">Approved districts on either bank of the main river. Old Bridge connects Market Spine to the small Civic Terrace. Only the primary route and district relationships are locked.</desc>
