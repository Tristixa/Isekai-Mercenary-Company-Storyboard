<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
<title id="title">Eurydica / Height and density</title><desc id="desc">District occupied-height ranges relative to local ground, using working storey guides. Roof shapes are not prescribed. The principal river crossing and mild terraces are retained.</desc>
<defs><style>
text{font-family:Arial,sans-serif;fill:#25343e}
.title{font-family:Georgia,serif;font-size:40px;font-weight:bold}
.sub{font-size:18px;fill:#54616a}
.h{font-size:24px;font-weight:bold}
.label{font-size:20px;font-weight:bold}
.small{font-size:17px}
.note{font-size:16px;fill:#54616a}
.center{text-anchor:middle}
.line{fill:none;stroke:#66747a;stroke-width:2}
.route{fill:none;stroke:#304d62;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.dash{fill:none;stroke:#66747a;stroke-width:3;stroke-dasharray:9 7}
</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#304d62" stroke-width="1.5"/></marker></defs>
<rect width="1500" height="1040" fill="#f7f7f3"/>
<text x="60" y="67" class="title">Eurydica / Height and density</text><text x="60" y="103" class="sub">Corrected 20 September 2026 · Relative hierarchy retained · Storeys are working guides, not fixed dimensions</text>
<text x="60" y="163" class="h">OCCUPIED HEIGHT ABOVE LOCAL GROUND</text>
<text x="60" y="198" class="note">Roof volume and terrain affect the visible skyline. Exact profiles remain to be designed.</text>
