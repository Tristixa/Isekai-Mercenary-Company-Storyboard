mall">Broad footprints and loading gaps</text><path d="M60 496 L1435 496" stroke="#e1e4e2"/><text x="60" y="480" class="small">Workshop Quarter</text><path d="M440 473 L720 473" stroke="#526d7b" stroke-width="12" stroke-linecap="round"/><circle cx="440" cy="473" r="8" fill="#304d62"/><circle cx="720" cy="473" r="8" fill="#304d62"/><text x="960" y="480" class="small">Grouped work buildings and yard breaks</text><path d="M60 543 L1435 543" stroke="#e1e4e2"/><text x="60" y="527" class="small">Service Lanes</text><path d="M440 520 L580 520" stroke="#526d7b" stroke-width="12" stroke-linecap="round"/><circle cx="440" cy="520" r="8" fill="#304d62"/><circle cx="580" cy="520" r="8" fill="#304d62"/><text x="960" y="527" class="small">Small buildings and rear courts</text><path d="M60 590 L1435 590" stroke="#e1e4e2"/><text x="60" y="574" class="small">Civic Terrace</text><path d="M440 567 L580 567" stroke="#526d7b" stroke-width="12" stroke-linecap="round"/><circle cx="440" cy="567" r="8" fill="#304d62"/><circle cx="580" cy="567" r="8" fill="#304d62"/><text x="960" y="574" class="small">Small offices; expressive craftsmanship</text><path d="M60 637 L1435 637" stroke="#e1e4e2"/><text x="60" y="621" class="small">Old City Streets</text><path d="M580 614 L860 614" stroke="#526d7b" stroke-width="12" stroke-linecap="round"/><circle cx="580" cy="614" r="8" fill="#304d62"/><circle cx="860" cy="614" r="8" fill="#304d62"/><text x="960" y="621" class="small">Densest attached groups</text><path d="M60 684 L1435 684" stroke="#e1e4e2"/><text x="60" y="668" class="small">Residential Quarter</text><path d="M440 661 L720 661" stroke="#526d7b" stroke-width="12" stroke-linecap="round"/><circle cx="440" cy="661" r="8" fill="#304d62"/><circle cx="720" cy="661" r="8" fill="#304d62"/><text x="960" y="668" class="small">Courts, gardens, stepped foundations</text><path d="M60 731 L1435 731" stroke="#e1e4e2"/><text x="60" y="715" class="small">Waterworks &amp; Gardens</text><path d="M440 708 L440 708" stroke="#526d7b" stroke-width="12" stroke-linecap="round"/><circle cx="440" cy="708" r="8" fill="#304d62"/><circle cx="440" cy="708" r="8" fill="#304d62"/><text x="960" y="715" class="small">Low utilities and planted/service ground</text><text x="60" y="794" class="h">LANDMARKS AND GROUND</text>
<text x="60" y="836" class="label">Old Bridge</text><text x="60" y="865" class="small">Primary city landmark through span,</text><text x="60" y="891" class="small">river views and route importance.</text>
<text x="552" y="836" class="label">Inherited watch-bell tower</text><text x="552" y="865" class="small">Tallest architectural marker in Old City.</text><text x="552" y="891" class="small">Exact height and form remain open.</text>
<text x="1040" y="836" class="label">Mild terraces</text><text x="1040" y="865" class="small">Stepped foundations, retaining edges,</text><text x="1040" y="891" class="small">selected trees and exposed rock.</text>
<path d="M60 929 L1435 929" class="line"/>
<text x="60" y="968" class="label">SOUTH GATE → ARRIVAL → MARKET → OLD BRIDGE → CIVIC TERRACE</text>
<text x="60" y="1004" class="note">Gate: compact practical landmark, about 1–2 occupied storeys plus roof. No facade or roof family is selected by this diagram.</text>
</svg>
