<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <style>
      .bg{fill:#f4eedf}.ink{fill:#193746}.muted{fill:#645c53}.panel{fill:#e9dfcb;stroke:#8b8073;stroke-width:2}.stone{fill:#8a8b82}.plaster{fill:#d8cbae}.ochre{fill:#c69b62}.sage{fill:#91a18d}.timber{fill:#4e4038}.clay{fill:#a75f4c}.darkroof{fill:#465765}.copper{fill:#638d84}.indigo{fill:#3f6274}.brass{fill:#b08c50}.paper{fill:#efe6d4}.line{stroke:#584f47;stroke-width:4;fill:none}.fine{stroke:#6f655b;stroke-width:2;fill:none}.repair{stroke:#d7bd86;stroke-width:8;fill:none;stroke-dasharray:20 10}.title{font:700 42px Georgia,serif;fill:#173748}.subtitle{font:500 19px Arial,sans-serif;fill:#61594f;letter-spacing:1px}.section{font:700 23px Arial,sans-serif;fill:#173748}.label{font:700 18px Arial,sans-serif;fill:#20343d}.small{font:400 15px Arial,sans-serif;fill:#4f4a44}.tiny{font:400 13px Arial,sans-serif;fill:#554e47}.center{text-anchor:middle}.light{fill:#f4eedf}.swatchname{font:700 14px Arial,sans-serif;fill:#20343d}.hex{font:400 12px Consolas,monospace;fill:#514a44}.rule{font:700 20px Arial,sans-serif;fill:#f4eedf;text-anchor:middle;dominant-baseline:middle}.number{font:700 24px Arial,sans-serif;fill:#f4eedf;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1200"/>
  <text class="title" x="70" y="68">Eurydica — Facade &amp; Material Language</text>
  <text class="subtitle" x="72" y="102">CONCEPT V0.1 · SHARED CITY GRAMMAR WITH OWNED, LIVED-IN VARIATION</text>

  <text class="section" x="70" y="150">1 · REGIONAL MATERIAL PALETTE</text>
  <g transform="translate(70 172)">
    <g transform="translate(0 0)"><rect class="stone" width="136" height="72"/><text class="swatchname" y="94">RIVER STONE</text><text class="hex" y="113">#8A8B82</text></g>
    <g transform="translate(148 0)"><rect class="plaster" width="136" height="72"/><text class="swatchname" y="94">PALE PLASTER</text><text class="hex" y="113">#D8CBAE</text></g>
    <g transform="translate(296 0)"><rect class="ochre" width="136" height="72"/><text class="swatchname" y="94">OCHRE</text><text class="hex" y="113">#C69B62</text></g>
    <g transform="translate(444 0)"><rect class="sage" width="136" height="72"/><text class="swatchname" y="94">DUSTY SAGE</text><text class="hex" y="113">#91A18D</text></g>
    <g transform="translate(592 0)"><rect class="timber" width="136" height="72"/><text class="swatchname" y="94">JOINERY</text><text class="hex" y="113">#4E4038</text></g>
    <g transform="translate(740 0)"><rect class="clay" width="136" height="72"/><text class="swatchname" y="94">CLAY ROOF</text><text class="hex" y="113">#A75F4C</text></g>
    <g transform="translate(888 0)"><rect class="darkroof" width="136" height="72"/><text class="swatchname" y="94">DARK ROOF</text><text class="hex" y="113">#465765</text></g>
    <g transform="translate(1036 0)"><rect class="copper" width="136" height="72"/><text class="swatchname" y="94">AGED COPPER</text><text class="hex" y="113">#638D84</text></g>
    <g transform="translate(1184 0)"><rect class="indigo" width="136" height="72"/><text class="swatchname" y="94">RIVER INDIGO</text><text class="hex" y="113">#3F6274</text></g>
    <g transform="translate(1332 0)"><rect class="brass" width="128" height="72"/><text class="swatchname" y="94">OLD BRASS</text><text class="hex" y="113">#B08C50</text></g>
  </g>

  <text class="section" x="70" y="330">2 · FOUR FACADE FAMILIES</text>

  <!-- Market facade -->
  <g transform="translate(70 355)">
    <rect class="panel" width="350" height="425" rx="3"/>
    <text class="label center" x="175" y="35">MARKET SPINE</text>
    <text class="small center" x="175" y="58">attached · adaptable · owner-marked</text>
    <rect class="stone" x="35" y="285" width="280" height="75"/>
    <rect class="ochre" x="35" y="145" width="280" height="140"/>
    <path class="clay" d="M20 145 L80 90 L210 108 L330 145 Z"/>
    <rect class="timber" x="64" y="145" width="12" height="140"/><rect class="timber" x="194" y="145" width="12" height="140"/>
    <rect class="indigo" x="88" y="180" width="72" height="58"/><rect class="paper" x="98" y="190" width="52" height="38"/>
    <rect class="indigo" x="225" y="180" width="58" height="58"/><rect class="paper" x="235" y="190" width="38" height="38"/>
    <rect class="timber" x="65" y="285" width="92" height="75"/><rect class="timber" x="230" y="285" width="58" height="75"/>
    <path class="copper" d="M45 265 L175 265 L155 300 L60 300 Z"/>
    <path class="repair" d="M240 112 L292 137"/>
    <text class="tiny" x="28" y="392">wide shop openings · varied bays · awning points</text>
  </g>

  <!-- Old City facade -->
  <g transform="translate(440 355)">
    <rect class="panel" width="350" height="425" rx="3"/>
    <text class="label center" x="175" y="35">OLD CITY</text>
    <text class="small center" x="175" y="58">compressed · inherited · irregular</text>
    <rect class="stone" x="35" y="290" width="280" height="70"/>
    <rect class="plaster" x="35" y="135" width="165" height="155"/>
    <rect class="sage" x="200" y="175" width="115" height="115"/>
    <path class="darkroof" d="M18 135 L92 78 L216 135 Z"/>
    <path class="clay" d="M188 175 L250 122 L330 175 Z"/>
    <rect class="timber" x="70" y="135" width="12" height="155"/><rect class="timber" x="154" y="135" width="12" height="155"/>
    <path class="fine" d="M35 228 L200 228 M200 238 L315 238"/>
    <rect class="indigo" x="100" y="170" width="45" height="55"/><rect class="paper" x="108" y="178" width="29" height="39"/>
    <rect class="timber" x="235" y="215" width="42" height="75"/>
    <path class="timber" d="M185 250 L225 220 L235 228 L195 260 Z"/>
    <path class="repair" d="M52 304 L120 304"/>
    <text class="tiny" x="28" y="392">overlapping ages · reused base · rare passage bridge</text>
  </g>

  <!-- Arrival / Company facade -->
  <g transform="translate(810 355)">
    <rect class="panel" width="350" height="425" rx="3"/>
    <text class="label center" x="175" y="35">ARRIVAL + COMPANY</text>
    <text class="small center" x="175" y="58">practical · low · expandable</text>
    <rect class="stone" x="35" y="290" width="280" height="70"/>
    <rect class="plaster" x="35" y="180" width="280" height="110"/>
    <path class="clay" d="M20 180 L92 120 L330 180 Z"/>
    <rect class="timber" x="66" y="180" width="13" height="110"/><rect class="timber" x="245" y="180" width="13" height="110"/>
    <rect class="indigo" x="105" y="220" width="80" height="70"/>
    <rect class="paper" x="215" y="215" width="58" height="46"/>
    <path class="copper" d="M260 180 L315 180 L315 255 L300 255 L300 198 L260 198 Z"/>
    <rect class="timber" x="28" y="315" width="75" height="8"/>
    <path class="repair" d="M205 143 L275 162"/>
    <text class="tiny" x="28" y="392">robust doors · broad eaves · visible growth yard</text>
  </g>

  <!-- Civic facade -->
  <g transform="translate(1180 355)">
    <rect class="panel" width="350" height="425" rx="3"/>
    <text class="label center" x="175" y="35">SIMPLE CIVIC TERRACE</text>
    <text class="small center" x="175" y="58">reused · restrained · non-monumental</text>
    <rect class="stone" x="35" y="292" width="280" height="68"/>
    <rect class="paper" x="35" y="178" width="280" height="114"/>
    <path class="darkroof" d="M20 178 L95 130 L330 178 Z"/>
    <rect class="timber" x="74" y="178" width="12" height="114"/><rect class="timber" x="260" y="178" width="12" height="114"/>
    <rect class="indigo" x="118" y="220" width="56" height="72"/>
    <rect class="indigo" x="210" y="212" width="45" height="45"/><rect class="plaster" x="218" y="220" width="29" height="29"/>
    <rect class="brass" x="52" y="205" width="44" height="35"/>
    <path class="repair" d="M175 292 L240 292"/>
    <text class="tiny" x="28" y="392">ordinary scale · clear entrance · no civic grandeur</text>
  </g>

  <text class="section" x="70" y="835">3 · THE CONTROLLED-VARIATION RULE</text>
  <g transform="translate(70 865)">
    <rect class="timber" width="850" height="80"/>
    <rect class="indigo" x="850" width="340" height="80"/>
    <rect class="brass" x="1190" width="170" height="80"/>
    <text class="rule" x="425" y="40">70% SHARED REGIONAL GRAMMAR</text>
    <text class="rule" x="1020" y="40">20% OWNER ADAPTATION</text>
    <text class="rule" x="1275" y="40">10% AGE / REPAIR</text>
    <text class="small" x="0" y="110">A design discipline, not a literal asset or pixel percentage.</text>
  </g>

  <text class="section" x="70" y="1030">4 · APPROVAL TEST</text>
  <circle cx="95" cy="1072" r="18" fill="#315860"/><text class="number" x="95" y="1072">1</text>
  <text class="label" x="125" y="1068">One city, several generations</text><text class="small" x="125" y="1093">shared construction without cloned facades</text>
  <circle cx="585" cy="1072" r="18" fill="#315860"/><text class="number" x="585" y="1072">2</text>
  <text class="label" x="615" y="1068">Life follows function</text><text class="small" x="615" y="1093">repairs and props explain ownership and routine</text>
  <circle cx="1080" cy="1072" r="18" fill="#315860"/><text class="number" x="1080" y="1072">3</text>
  <text class="label" x="1110" y="1068">Fantasy stays restrained</text><text class="small" x="1110" y="1093">regional forms and color, not crystal clutter</text>

  <text class="tiny" x="70" y="1160">Concept palette and facade grammar only. Final rendering, lighting, camera, modular dimensions and surface values remain unresolved.</text>
</svg>
