<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
<title id="title">Eurydica / Architecture redesign brief</title><desc id="desc">The corrected brief joins Steambot urban function, Amalur fantasy forms and landscape composition, and IMC JRPG readability. It leads to a Market Spine street study before final facade and palette decisions.</desc>
<defs><style>
text{font-family:Arial,sans-serif;fill:#25343e}
.title{font-family:Georgia,serif;font-size:40px;font-weight:bold}
.sub{font-size:18px;fill:#54616a}
.h{font-size:24px;font-weight:bold}
.label{font-size:20px;font-weight:bold}
.small{font-size:17px}
.note{font-size:16px;fill:#54616a}
.center{text-anchor:middle}
.line{fill:none;stroke:#66747a;stroke-width:2}
.route{fill:none;stroke:#304d62;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.dash{fill:none;stroke:#66747a;stroke-width:3;stroke-dasharray:9 7}
</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#304d62" stroke-width="1.5"/></marker></defs>
<rect width="1500" height="1040" fill="#f7f7f3"/>
<text x="60" y="67" class="title">Eurydica / Architecture redesign brief</text><text x="60" y="103" class="sub">Corrected 20 September 2026 · Active direction for the next concept · Facade designs and final palette remain open</text>
<text x="60" y="164" class="h">REFERENCE RESPONSIBILITIES</text><path d="M60 186 L500 186" stroke="#526d7b" stroke-width="4"/><text x="60" y="222" class="label">STEAMBOT CHRONICLES</text><text x="60" y="257" class="small">City scale and daily function</text><text x="60" y="288" class="note">Infrastructure · neighborhoods · ownership</text><path d="M550 186 L990 186" stroke="#526d7b" stroke-width="4"/><text x="550" y="222" class="label">AMALUR</text><text x="550" y="257" class="small">Fantasy forms and atmosphere</text><text x="550" y="288" class="note">Expressive roofs · landscape · scene color</text><path d="M1040 186 L1480 186" stroke="#526d7b" stroke-width="4"/><text x="1040" y="222" class="label">CURRENT IMC</text><text x="1040" y="257" class="small">JRPG presentation</text><text x="1040" y="288" class="note">Character readability · portrait/world fit</text><path d="M282 314 L282 342 L750 342 L750 375 M772 314 L772 342 M1260 314 L1260 342 L750 342" class="line"/>
<text x="750" y="412" class="h center">Everyday architecture is recognizably fantastical.</text>
<text x="750" y="444" class="small center">Control detail and focal points for readability.</text>
<path d="M60 474 L1440 474" class="line"/>
<text x="60" y="515" class="h">DEVELOP TOGETHER IN A COMPLETE STREET</text><text x="60" y="563" class="label">BUILDING FORM</text><text x="60" y="610" class="small">Sweeping roof volumes and deep eaves</text><text x="60" y="640" class="small">Shaped openings and substantial supports</text><text x="60" y="670" class="small">Projecting rooms and readable construction</text><text x="550" y="563" class="label">LANDSCAPE &amp; USE</text><text x="550" y="610" class="small">Foundations fitted to mild terraces</text><text x="550" y="640" class="small">Trees and rocks that shape courts and routes</text><text x="550" y="670" class="small">Repairs, thresholds and loading tied to function</text><text x="1040" y="563" class="label">SCENE COLOR</text><text x="1040" y="610" class="small">Dominant roof and foliage masses</text><text x="1040" y="640" class="small">Supporting wall and ground colors</text><text x="1040" y="670" class="small">Localized cloth and activity accents</text><path d="M60 704 L1440 704" class="line"/>
<text x="60" y="746" class="h">CIVIC TERRACE</text>
<text x="60" y="784" class="small">Small footprint · limited services · reused buildings</text>
<text x="750" y="784" class="small">Expressive local roofs, windows, doors and color</text>
<text x="60" y="818" class="note">Institutional simplicity and fantasy craftsmanship can coexist. The Company still fills the adventurer-coordination gap.</text>
<path d="M60 852 L1440 852" class="line"/>
<text x="60" y="894" class="h">NEXT DESIGN TEST / MARKET SPINE APPROACHING OLD BRIDGE</text>
<text x="60" y="936" class="small">Three neighboring buildings + side passage + substantial tree + merchant frontage + clear main route</text>
<text x="60" y="975" class="small">Judge form and color in context; derive facade families and material swatches from the successful composition.</text>
<text x="60" y="1014" class="note">Retained: river, district relationships, city scale, height hierarchy, modest civic capacity and inherited tower.</text>
</svg>
