<!-- district labels -->
<text x="86" y="318" class="h">QUAYS &amp; STOREYARDS</text>
<text x="86" y="348">Bulk storage · loading shelter</text>
<text x="86" y="376" class="small">Brown roofs / earth receiving yard</text>
<text x="488" y="312" class="h">MARKET</text><text x="488" y="340" class="h">SPINE</text>
<text x="488" y="368" class="small">Shops / tavern</text>
<text x="780" y="318" class="h">SERVICE LANES</text>
<text x="780" y="348">Food · doctor / clinic</text>
<text x="780" y="376" class="small">Paved court / warm mixed roofs</text>
<text x="780" y="401" class="small">Moderately leafy neighborhood</text>
<text x="84" y="620" class="h">WORKSHOP</text><text x="84" y="649" class="h">QUARTER</text>
<text x="84" y="681" class="small">Repair / tools / containers</text>
<text x="84" y="711" class="small">Brown roofs / earth courts</text>
<text x="84" y="740" class="small">Sparse trees</text>
<text x="421" y="645" class="h">COMPANY</text><text x="421" y="674" class="h">EDGE</text>
<text x="421" y="759" class="small">House + growth yard</text>
<text x="421" y="788" class="small">Retain plum / green</text>
<text x="746" y="837" class="h">ARRIVAL WARD</text>
<text x="746" y="867" class="small">Lodging / cart yard / guard</text>
