<g><circle cx="635" cy="842" r="18" class="node"/><text x="635" y="848" class="num">1</text>
<circle cx="623" cy="417" r="18" class="node"/><text x="623" y="423" class="num">2</text>
<circle cx="623" cy="487" r="18" class="node"/><text x="623" y="493" class="num">3</text>
<circle cx="649" cy="796" r="18" class="node"/><text x="649" y="802" class="num">4</text>
<circle cx="635" cy="712" r="18" class="node"/><text x="635" y="718" class="num">5</text>
<circle cx="623" cy="549" r="18" class="node"/><text x="623" y="555" class="num">6</text></g>
<!-- key panel -->
<path d="M1070 138 L1070 1010" class="rule"/>
<text x="1100" y="167" class="h">APPROVED CONNECTIONS</text>
<text x="1100" y="211">1  Arrival → working route</text><text x="1126" y="239" class="small">Earth starts west of paved spine.</text>
<text x="1100" y="284">2  Quays → market storage edge</text><text x="1126" y="312" class="small">Unload off the main bridge approach.</text>
<text x="1100" y="357">3  Market → Service Lanes</text><text x="1126" y="385" class="small">Paved access to food and clinic.</text>
<text x="1100" y="430">4  Service Lanes → Arrival</text><text x="1126" y="458" class="small">Public loop; avoid private courtyards.</text>
<text x="1100" y="503">5  Company entrance</text><text x="1126" y="531" class="small">Level/ramped delivery access; grade later.</text>
<text x="1100" y="576">6  Workshops → market</text><text x="1126" y="604" class="small">Short local supply connection.</text>
<path d="M1100 635 L1550 635" class="rule"/>
<text x="1100" y="673" class="h">CONTINUITY LOCKS</text>
<text x="1100" y="710" class="small">* One gate and one lodging house, not duplicates.</text>
<text x="1100" y="739" class="small">Shared roofs: original Arrival green.</text>
<text x="1100" y="768" class="small">Workshop / quay roofs remain brown.</text>
<text x="1100" y="797" class="small">Service Lanes remain paved and warm-roofed.</text>
<text x="1100" y="842" class="h">STILL TO RESOLVE</text>
<text x="1100" y="876" class="small">Exact grade, retaining walls and ramp lengths.</text>
<text x="1100" y="905" class="small">Street widths, parcel sizes and actor scale.</text>
<text x="1100" y="934" class="small">No new bridge or east/west gate is implied.</text>
<text x="1100" y="978" class="small muted">Areas and points are planning marks,</text>
<text x="1100" y="1003" class="small muted">not proposed roof shapes or building footprints.</text>
<path d="M50 1051 L115 1051" class="paved"/><text x="130" y="1057" class="small">Paved main route</text>
<path d="M330 1051 L395 1051" class="local"/><text x="410" y="1057" class="small">Paved local route</text>
<path d="M600 1051 L675 1051" class="dirt"/><text x="690" y="1057" class="small">Earth working route</text>
<path d="M905 1038 L905 1066" stroke="#26343b" stroke-width="4"/><text x="925" y="1057" class="small">Surface transition</text>
</svg>
