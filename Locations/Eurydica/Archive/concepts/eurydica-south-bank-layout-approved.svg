<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<title>Eurydica south-bank continuity study</title>
<desc>Proposed junction placement within approved district relationships. North up. Paved primary and service routes, dirt working loop. Not to scale.</desc>
<style>text{font-family:Arial,sans-serif;fill:#26343b;font-size:19px}.title{font-size:36px;font-weight:bold}.h{font-size:23px;font-weight:bold}.small{font-size:16px}.muted{fill:#59666c}.area{fill:#eeeee6;stroke:#bbc1bb;stroke-width:2}.paved{fill:none;stroke:#566f7b;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}.local{fill:none;stroke:#566f7b;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.dirt{fill:none;stroke:#a67443;stroke-width:11;stroke-dasharray:18 8;stroke-linecap:round}.node{fill:#fffaf0;stroke:#26343b;stroke-width:2}.num{font-size:17px;font-weight:bold;text-anchor:middle}.rule{stroke:#c5cbc8;stroke-width:1}</style>
<rect width="1600" height="1100" fill="#faf9f3"/>
<text x="45" y="60" class="title">EURYDICA — SOUTH-BANK LAYOUT STUDY</text>
<text x="45" y="94" class="muted">Approved relationship study · district identities and junction arrangement accepted · north up · not to scale</text>
